<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Какую услугу добавить · Razden’sya</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../общее/бренд.css">
<style>
.hero { position: relative; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 26px max(16px, env(safe-area-inset-left, 0px)) 22px; background: var(--dark); color: #f5ecda; border-radius: 0 0 28px 28px; overflow: hidden }
.hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; border: 1px solid rgba(197,146,30,.35); box-shadow: 0 0 0 26px rgba(197,146,30,.05), 0 0 0 56px rgba(197,146,30,.03) }
.hero .logo-text { font-size: 28px; background: linear-gradient(180deg, #f0d08a, #c5921e); -webkit-background-clip: text; background-clip: text }
.hero h1 { margin: 12px 0 6px; font: 400 36px/1.02 var(--f-display); color: #f8eedb; position: relative; z-index: 1 }
.hero p { margin: 0; font-size: 14px; color: #d4c6ac; position: relative; z-index: 1 }
.meta { display: flex; gap: 16px; margin-top: 14px; position: relative; z-index: 1 }
.meta div b { display: block; font-size: 22px; color: #f0c86a; font-variant-numeric: tabular-nums }
.meta div span { font-size: 11.5px; color: #b9ab90 }
.left { margin: 16px 0 10px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700 }
.left .dots { display: flex; gap: 5px }
.left .dots i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--gold) }
.left .dots i.used { background: var(--gold) }
.opts { display: grid; gap: 8px }
.opt { position: relative; overflow: hidden; display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; text-align: left; border: 1.5px solid rgba(74,56,16,.14); background: var(--paper); border-radius: 18px; padding: 12px; cursor: pointer; color: var(--ink) }
.opt .fill { position: absolute; inset: 0 auto 0 0; background: rgba(197,146,30,.16); transition: width .5s ease; z-index: 0 }
.opt > *:not(.fill) { position: relative; z-index: 1 }
.opt .ck { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid rgba(74,56,16,.25); display: grid; place-items: center; background: #fff }
.opt .ck svg { width: 18px; height: 18px; fill: transparent }
.opt b { display: block; font-size: 14.5px }
.opt small { font-size: 12px; color: var(--muted) }
.opt .pct { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--gold-t) }
.opt.on { border-color: var(--brown) }
.opt.on .ck { background: var(--brown); border-color: var(--brown) }
.opt.on .ck svg { fill: #fff }
.opt.lead-opt .fill { background: rgba(197,146,30,.3) }
.own { margin-top: 14px; display: grid; gap: 8px }
.own .row { display: grid; grid-template-columns: 1fr auto; gap: 8px }
.own .btn { min-height: 46px; padding: 0 14px }
.why { margin-top: 14px; font-size: 12.5px; color: var(--muted); text-align: center }
.demo { font-size: 11.5px; color: var(--gold-t); text-align: center; margin: 8px 0 0 }
</style>
</head>
<body data-variant="15">
<main class="col">
  <header class="hero">
    <span class="logo-text">Razden’sya</span>
    <h1>Какую услугу добавить?</h1>
    <p>Марина выбирает, что добавить в кабинет. Отдайте до трёх голосов за то, на что пошли бы сами.</p>
    <div class="meta"><div><b id="total">0</b><span>голосов</span></div><div><b id="people">0</b><span>проголосовали</span></div><div><b id="leader">—</b><span>лидер</span></div></div>
  </header>

  <div class="left"><span id="leftT">Осталось голосов: 3</span><span class="dots" id="dots"><i></i><i></i><i></i></span></div>
  <div class="opts" id="opts"></div>

  <section class="card own">
    <b>Своя идея</b>
    <div class="row"><input class="input" id="idea" maxlength="80" placeholder="Например: уход за кожей рук"><button type="button" class="btn btn-dark" id="send">Предложить</button></div>
  </section>
  <p class="why">Итоги видны всем сразу. Голосовать можно без регистрации.</p>
  <p class="demo" id="demo"></p>

  <div class="contacts" style="margin-top:18px"></div>
  <p class="signature"></p>
</main>
<script src="../общее/бренд.js"></script>
<script>
(function () {
  var R = Razden, $ = function (id) { return document.getElementById(id) };
  // Общие голоса — в Firebase Realtime Database (бесплатно). Адрес базы впишем при сборке; пока пусто — режим примера
  var FB_URL = "";
  var OPTS = [
    ["face", "Уходовые процедуры для лица", "очищение, маски, увлажнение"],
    ["fmass", "Массаж лица", "лифтинг и расслабление"],
    ["sugar", "Шугаринг", "депиляция сахарной пастой"],
    ["brows", "Брови и ресницы", "коррекция, окрашивание, ламинирование"],
    ["wrap", "Обёртывания для тела", "уход за кожей тела"],
    ["bmass", "Массаж тела", "расслабляющий и моделирующий"]
  ];
  var SEED = { face: 18, fmass: 11, sugar: 14, brows: 21, wrap: 6, bmass: 9 }, SEED_PEOPLE = 31;
  var mine = R.get("poll-mine", []), counts = {}, people = 0;

  function load() {
    if (!FB_URL) {
      counts = Object.assign({}, SEED); people = SEED_PEOPLE + (mine.length ? 1 : 0);
      mine.forEach(function (id) { counts[id]++ });
      $("demo").textContent = "Сейчас пример: голоса хранятся только в этом телефоне. На сайте они будут общими.";
      return Promise.resolve();
    }
    return fetch(FB_URL + "/poll.json").then(function (r) { return r.json() }).then(function (j) { counts = (j && j.votes) || {}; people = (j && j.people) || 0 });
  }
  function push(id, delta, personDelta) {
    if (!FB_URL) return Promise.resolve();
    var body = {}; body["votes/" + id] = { ".sv": { increment: delta } };
    if (personDelta) body.people = { ".sv": { increment: personDelta } };
    return fetch(FB_URL + "/poll.json", { method: "PATCH", body: JSON.stringify(body) }).catch(function () {});
  }

  function render() {
    var total = OPTS.reduce(function (s, o) { return s + (counts[o[0]] || 0) }, 0), max = 0, lead = null;
    OPTS.forEach(function (o) { if ((counts[o[0]] || 0) > max) { max = counts[o[0]]; lead = o } });
    $("total").textContent = total; $("people").textContent = people;
    $("leader").textContent = lead ? lead[1].split(" ")[0] : "—";
    $("opts").innerHTML = OPTS.map(function (o) {
      var c = counts[o[0]] || 0, pct = total ? Math.round(c / total * 100) : 0, on = mine.indexOf(o[0]) > -1;
      return '<button type="button" class="opt' + (on ? " on" : "") + (lead && lead[0] === o[0] ? " lead-opt" : "") + '" data-id="' + o[0] + '" aria-pressed="' + on + '"><span class="fill" style="width:' + pct + '%"></span><span class="ck">' + R.icon("check") + "</span><span><b>" + o[1] + "</b><small>" + o[2] + " · " + c + " " + R.plural(c, "голос", "голоса", "голосов") + '</small></span><span class="pct">' + pct + "%</span></button>";
    }).join("");
    var left = 3 - mine.length;
    $("leftT").textContent = left ? "Осталось голосов: " + left : "Все три голоса отданы";
    document.querySelectorAll("#dots i").forEach(function (d, k) { d.classList.toggle("used", k < mine.length) });
  }

  $("opts").addEventListener("click", function (e) {
    var b = e.target.closest(".opt"); if (!b) return;
    var id = b.dataset.id, k = mine.indexOf(id), first = !mine.length;
    if (k > -1) { mine.splice(k, 1); counts[id]--; push(id, -1, mine.length ? 0 : -1); if (!mine.length) people-- }
    else {
      if (mine.length >= 3) { R.toast("Можно отдать до трёх голосов. Снимите один, чтобы переголосовать"); return }
      mine.push(id); counts[id] = (counts[id] || 0) + 1; push(id, 1, first ? 1 : 0); if (first) people++;
      R.toast("Голос учтён");
    }
    R.set("poll-mine", mine); render();
  });
  $("send").addEventListener("click", function () {
    var v = $("idea").value.trim(); if (!v) { R.toast("Напишите идею"); return }
    R.send("Марина, предлагаю добавить в кабинет услугу: " + v + ".", { title: "Идея для Марины" });
  });
  load().then(render).catch(render);
})();
</script>
</body>
</html>
