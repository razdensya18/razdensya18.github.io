<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>До и после · Razden’sya</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../общее/бренд.css">
<style>
.top { display: flex; justify-content: space-between; align-items: center; padding: 20px 0 4px }
.top .logo-text { font-size: 30px }
h1 { margin: 8px 0 4px; font: 400 40px/1 var(--f-display) }
.lead { margin: 0 0 14px; font-size: 14px; color: var(--text) }

/* шаги */
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px }
.steps span { display: grid; gap: 6px; font-size: 11.5px; font-weight: 700; color: var(--muted) }
.steps span::before { content: ""; height: 4px; border-radius: 2px; background: var(--cream-2) }
.steps span.on { color: var(--ink) }
.steps span.on::before { background: var(--g-btn) }
.step { display: grid; gap: 12px }
.step h2 { margin: 0; font: 400 28px/1.05 var(--f-display) }
.step > p { margin: 0; font-size: 13.5px; color: var(--text); line-height: 1.45 }
.how { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; counter-reset: h }
.how li { counter-increment: h; display: grid; grid-template-columns: 26px 1fr; gap: 10px; font-size: 13.5px; color: var(--text); line-height: 1.4 }
.how li::before { content: counter(h); width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--gold); display: grid; place-items: center; font-weight: 800; font-size: 12px; color: var(--gold-t) }
.zones { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px }
.zones::-webkit-scrollbar { display: none }
.zones .chip { flex: none }
.thumb { display: grid; grid-template-columns: 84px 1fr; gap: 12px; align-items: center; background: var(--cream); border-radius: 16px; padding: 10px }
.thumb img { width: 84px; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 12px }
.thumb b { display: block; font-size: 14px }
.thumb span { font-size: 12.5px; color: var(--muted) }
.thumb button { margin-top: 6px; border: 0; background: none; padding: 0; color: var(--gold-t); font-weight: 800; font-size: 12.5px; text-decoration: underline; cursor: pointer }
.when { background: rgba(197,146,30,.12); border-radius: 14px; padding: 10px 12px; font-size: 13px; color: var(--gold-t); font-weight: 700; line-height: 1.4 }

/* сравнение ползунком */
.cmp { position: relative; aspect-ratio: 4 / 5; border-radius: 20px; overflow: hidden; background: var(--cream-2); user-select: none; touch-action: pan-y }
.cmp img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none }
.cmp .after { clip-path: inset(0 0 0 var(--x, 50%)) }
.cmp .handle { position: absolute; top: 0; bottom: 0; left: var(--x, 50%); width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 6px rgba(0,0,0,.35); pointer-events: none }
.cmp .handle::after { content: "‹ ›"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 42px; height: 42px; border-radius: 50%; background: #fff; color: var(--brown); display: grid; place-items: center; font-weight: 800; font-size: 16px; box-shadow: 0 4px 12px rgba(0,0,0,.25) }
.cmp .tag { position: absolute; top: 10px; padding: 5px 10px; border-radius: 9px; background: rgba(31,26,20,.78); color: #fff; font-size: 12px; font-weight: 800; pointer-events: none }
.cmp .tag.l { left: 10px } .cmp .tag.r { right: 10px }
.cmp .ex { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: rgba(255,252,246,.92); color: var(--gold-t); font-size: 11.5px; font-weight: 800; padding: 6px 10px; border-radius: 9px; white-space: nowrap; pointer-events: none }
.cmp input[type=range] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0 }
.cmp-info { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 8px }
.cmp-info b { color: var(--ink) }

/* съёмка «после» с просвечивающим «до» */
.stage { position: relative; aspect-ratio: 4 / 5; border-radius: 20px; overflow: hidden; background: #1f1a14; touch-action: none; user-select: none }
.stage video, .stage .shot, .stage .ghost { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover }
.stage .shot { transform-origin: center }
.stage .ghost { pointer-events: none }
.stage .tag { position: absolute; left: 10px; top: 10px; background: rgba(31,26,20,.75); color: #fff; font-size: 11.5px; font-weight: 700; padding: 5px 9px; border-radius: 9px; pointer-events: none }
.stage .hint { position: absolute; left: 10px; right: 10px; bottom: 10px; background: rgba(31,26,20,.7); color: #f3ead8; font-size: 12px; padding: 7px 10px; border-radius: 10px; text-align: center; pointer-events: none }
.range { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: 12.5px; font-weight: 700; color: var(--text) }
.range input { width: 100%; accent-color: var(--brown) }
.range b { min-width: 38px; text-align: right; font-variant-numeric: tabular-nums }
.shutter { justify-self: center; width: 74px; height: 74px; border-radius: 50%; border: 4px solid var(--brown); background: #fff; cursor: pointer; box-shadow: 0 0 0 4px var(--cream), 0 10px 20px -10px rgba(74,56,16,.8) }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.tip { font-size: 12.5px; color: var(--muted); text-align: center; margin: 0 }

/* согласие */
.ask { background: var(--dark); color: #f5ecda; border-radius: 22px; padding: 18px 16px; display: grid; gap: 10px }
.ask .k { font-size: 10.5px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: #dcb35a }
.ask h3 { margin: 0; font: 400 26px/1.08 var(--f-display); color: #f8eedb }
.ask p { margin: 0; font-size: 13px; color: #d4c6ac; line-height: 1.45 }
.ask .btn-line { background: transparent; color: #f5ecda; border-color: rgba(220,179,90,.6) }
.ask.sent { background: var(--ok) }
.ask.sent p { color: #e7f0e4 }
.btns { display: grid; gap: 8px }
.again { display: block; margin: 4px auto 0; border: 0; background: none; color: var(--muted); font-weight: 700; font-size: 13px; text-decoration: underline; cursor: pointer }
</style>
</head>
<body data-variant="17">
<main class="col">
  <header class="top"><span class="logo-text">Razden’sya</span><span class="pill" style="font-size:9.5px">было — стало</span></header>
  <h1>До и после</h1>
  <p class="lead">Когда видишь кожу каждый день, изменения не замечаешь. Сравните фото «до» с приёма и своё фото «после» и посмотрите, как кожа изменилась на самом деле.</p>

  <section class="card">
    <div class="steps" aria-hidden="true"><span data-s="1">Фото «до»</span><span data-s="2">Фото «после»</span><span data-s="3">Сравнение</span></div>
    <div id="app"></div>
  </section>

  <input type="file" accept="image/*" id="fileBefore" hidden>
  <input type="file" accept="image/*" capture="environment" id="fileAfter" hidden>
  <input type="file" accept="image/*" id="fileAfterGallery" hidden>
  <div class="contacts" style="margin-top:18px"></div>
  <p class="signature"></p>
</main>
<script src="../общее/бренд.js"></script>
<script>
(function () {
  var R = Razden, $ = function (id) { return document.getElementById(id) }, app = $("app");
  // всё хранится только в этом телефоне: фото «до», «после», дата и зона
  var st = { before: null, after: null, proc: R.ymd(R.today()), afterDate: null, zone: "zhivot", sent: false };
  var urls = {}, view = 1, stream = null, tx = 0, ty = 0, sc = 1, rawAfter = null;

  function db() { return new Promise(function (res, rej) { try { var rq = indexedDB.open("razden-ba", 1); rq.onupgradeneeded = function () { rq.result.createObjectStore("s") }; rq.onsuccess = function () { res(rq.result) }; rq.onerror = rej } catch (e) { rej(e) } }) }
  function save() { return db().then(function (d) { return new Promise(function (res) { var t = d.transaction("s", "readwrite"); t.objectStore("s").put(st, "current"); t.oncomplete = res; t.onerror = res }) }).catch(function () {}) }
  function load() { return db().then(function (d) { return new Promise(function (res) { var rq = d.transaction("s").objectStore("s").get("current"); rq.onsuccess = function () { if (rq.result) st = rq.result; res() }; rq.onerror = function () { res() } }) }).catch(function () {}) }
  function url(k) { if (!st[k]) return ""; if (!urls[k] || urls[k].b !== st[k]) urls[k] = { b: st[k], u: URL.createObjectURL(st[k]) }; return urls[k].u }
  function days() { if (!st.afterDate) return 0; return Math.max(0, Math.round((R.parse(st.afterDate) - R.parse(st.proc)) / 864e5)) }

  function render() {
    view = !st.before ? 1 : !st.after ? 2 : 3;
    document.querySelectorAll(".steps span").forEach(function (s) { s.classList.toggle("on", +s.dataset.s <= view) });
    var h = "";
    if (view === 1) {
      h = '<div class="step"><h2>Шаг 1. Фото «до»</h2><p>Марина фотографирует зону на приёме и присылает фото вам в Telegram.</p>' +
        '<ol class="how"><li>Откройте чат с Мариной и сохраните фото в галерею телефона</li><li>Нажмите кнопку ниже и выберите это фото</li></ol>' +
        '<div class="field"><label>Зона</label><div class="zones" id="zones">' + R.zones.map(function (z) { return '<button type="button" class="chip' + (z.id === st.zone ? " on" : "") + '" data-z="' + z.id + '">' + z.name + "</button>" }).join("") + "</div></div>" +
        '<div class="field"><label for="proc">Дата процедуры</label><input class="input" type="date" id="proc" value="' + st.proc + '" max="' + R.ymd(R.today()) + '"></div>' +
        '<button type="button" class="btn btn-gold" id="pickBefore">' + R.icon("image") + "Загрузить фото «до»</button>" +
        '<div class="cmp" id="cmp" style="--x:50%"><img src="../ресурсы/пример-было-2.jpg" alt="Пример: до"><img class="after" src="../ресурсы/пример-стало-2.jpg" alt="Пример: после"><span class="handle"></span><span class="tag l">до</span><span class="tag r">после</span><span class="ex">Пример: потяните ползунок</span><input type="range" id="sl" min="0" max="100" value="50" aria-label="Сравнить до и после"></div></div>';
    }
    if (view === 2) {
      var ready = R.addDays(R.parse(st.proc), 30), left = Math.round((ready - R.today()) / 864e5);
      h = '<div class="step"><div class="thumb"><img src="' + url("before") + '" alt="Фото до"><div><b>Фото «до» загружено</b><span>' + R.zone(st.zone).name + ", процедура " + R.date(R.parse(st.proc)) + '</span><br><button type="button" id="changeBefore">Заменить</button></div></div>' +
        "<h2>Шаг 2. Фото «после»</h2>" +
        '<div class="when">' + (left > 0 ? "Лучшее время для фото «после» — " + R.date(ready, { day: "numeric", month: "long" }) + ", через месяц после процедуры. Осталось " + left + " " + R.plural(left, "день", "дня", "дней") + "." : "Пора: прошёл месяц после процедуры, можно делать фото «после».") + "</div>" +
        '<ol class="how"><li>Встаньте у окна, при дневном свете, как на приёме</li><li>Включите камеру: фото «до» будет просвечивать, совместите контуры</li><li>Снимайте только зону, без лица</li></ol>' +
        '<div id="shoot"></div>' +
        (left > 0 ? '<button type="button" class="btn btn-line" id="remind">' + R.icon("bell") + "Напомнить в этот день</button>" : "") + "</div>";
    }
    if (view === 3) {
      var d = days();
      h = '<div class="step"><h2>Шаг 3. Сравнение</h2><p>Потяните ползунок: слева — как было, справа — как стало.</p>' +
        '<div class="cmp" id="cmp" style="--x:50%"><img src="' + url("before") + '" alt="До"><img class="after" src="' + url("after") + '" alt="После"><span class="handle"></span><span class="tag l">до · ' + R.date(R.parse(st.proc), { day: "numeric", month: "short" }) + '</span><span class="tag r">после · ' + R.date(R.parse(st.afterDate), { day: "numeric", month: "short" }) + '</span><input type="range" id="sl" min="0" max="100" value="50" aria-label="Сравнить до и после"></div>' +
        '<div class="cmp-info"><span>' + R.zone(st.zone).name + "</span><b>прошло " + d + " " + R.plural(d, "день", "дня", "дней") + "</b></div>" +
        (st.sent
          ? '<section class="ask sent"><span class="k" style="color:#fff">отправлено</span><h3>Фото у Марины</h3><p>Спасибо! Вы разрешили использовать фото «до» и «после» в постах @razdensya18 без лица и имени. Передумаете — напишите Марине.</p></section>'
          : '<section class="ask"><span class="k">вопрос от Марины</span><h3>Можно использовать эти фото в постах?</h3><p>Фото «до» и «после» помогут другим увидеть реальный результат. Только зона, без лица и имени. Если согласны, фото «после» уйдёт Марине в Telegram.</p>' +
            '<button type="button" class="btn btn-gold" id="yes">' + R.icon("tg") + 'Да, отправить Марине</button><button type="button" class="btn btn-line" id="no">Нет, только для меня</button></section>') +
        '<div class="btns"><button type="button" class="btn btn-soft" id="saveCollage">' + R.icon("image") + 'Сохранить «до / после» себе</button><button type="button" class="btn btn-soft" id="redoAfter">Переснять «после»</button></div>' +
        '<button type="button" class="again" id="restart">Начать заново</button></div>';
    }
    app.innerHTML = h;
    bind();
  }

  function bind() {
    var b, sl = $("sl");
    if (sl) sl.oninput = function () { $("cmp").style.setProperty("--x", sl.value + "%") };
    if ((b = $("zones"))) b.onclick = function (e) { var x = e.target.closest(".chip"); if (!x) return; st.zone = x.dataset.z; this.querySelectorAll(".chip").forEach(function (c) { c.classList.toggle("on", c === x) }) };
    if ((b = $("proc"))) b.onchange = function () { st.proc = this.value || R.ymd(R.today()) };
    if ((b = $("pickBefore"))) b.onclick = function () { $("fileBefore").click() };
    if ((b = $("changeBefore"))) b.onclick = function () { $("fileBefore").click() };
    if ((b = $("remind"))) b.onclick = function () {
      var d = R.addDays(R.parse(st.proc), 30); d.setHours(12, 0);
      R.saveFile("foto-posle-razdensya.ics", R.ics([{ title: "Фото «после» для сравнения (Razden’sya)", start: d, minutes: 10, desc: "Дневной свет, тот же ракурс, что на приёме.", alarm: 0 }]));
      R.toast("Открываю файл для календаря");
    };
    if ($("shoot")) shootUI("start");
    if ((b = $("yes"))) b.onclick = send;
    if ((b = $("no"))) b.onclick = function () { R.toast("Хорошо, фото остаются только в вашем телефоне"); this.closest(".ask").innerHTML = '<span class="k">только для вас</span><h3>Фото остаются у вас</h3><p>Они хранятся только в этом телефоне. Если передумаете, нажмите «Отправить» ниже.</p><button type="button" class="btn btn-line" id="yes2">' + R.icon("tg") + "Отправить Марине</button>"; $("yes2").onclick = send };
    if ((b = $("saveCollage"))) b.onclick = function () { R.toast("Готовлю картинку…"); collage().then(function (blob) { var u = URL.createObjectURL(blob), a = document.createElement("a"); a.href = u; a.download = "do-posle-razdensya.jpg"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u) }, 4000); R.toast("Сохраняю картинку «до / после»") }) };
    if ((b = $("redoAfter"))) b.onclick = function () { st.after = null; st.afterDate = null; st.sent = false; save().then(render) };
    if ((b = $("restart"))) b.onclick = function () { st = { before: null, after: null, proc: R.ymd(R.today()), afterDate: null, zone: st.zone, sent: false }; save().then(render) };
  }

  // ---------- съёмка «после» ----------
  function shootUI(mode) {
    var box = $("shoot"); if (!box) return;
    if (mode === "start") {
      box.innerHTML = '<div class="btns"><button type="button" class="btn btn-gold" id="cam">' + R.icon("camera") + 'Включить камеру</button><button type="button" class="btn btn-line" id="gal">Выбрать фото из галереи</button></div>';
      $("cam").onclick = startCam; $("gal").onclick = function () { $("fileAfterGallery").click() };
      return;
    }
    box.innerHTML = '<div class="stage" id="stage"><video id="video" playsinline muted' + (mode === "live" ? "" : " hidden") + '></video><img class="shot" id="shot" alt=""' + (mode === "align" ? "" : " hidden") + '><img class="ghost" id="ghost" src="' + url("before") + '" alt=""><span class="tag">просвечивает фото «до»</span><span class="hint" id="hint">' + (mode === "live" ? "Совместите контуры с фото «до» и снимайте" : "Сдвиньте пальцем и подгоните размер, чтобы контуры совпали") + "</span></div>" +
      '<label class="range"><span>Фото «до»</span><input type="range" id="op" min="0" max="85" value="40"><b id="opv">40%</b></label>' +
      (mode === "align" ? '<label class="range"><span>Размер</span><input type="range" id="sc" min="70" max="150" value="' + Math.round(sc * 100) + '"><b id="scv">' + Math.round(sc * 100) + "%</b></label>" : "") +
      (mode === "live" ? '<button type="button" class="shutter" id="snap" aria-label="Снять"></button><button type="button" class="btn btn-soft" id="stop">Отмена</button>' : '<div class="two"><button type="button" class="btn btn-soft" id="redo">Переснять</button><button type="button" class="btn btn-gold" id="done">Готово</button></div>');
    var op = $("op"); op.oninput = function () { $("ghost").style.opacity = op.value / 100; $("opv").textContent = op.value + "%" }; op.oninput();
    if (mode === "live") { $("video").srcObject = stream; $("video").play(); $("snap").onclick = snap; $("stop").onclick = function () { stopCam(); shootUI("start") } }
    if (mode === "align") {
      $("shot").src = URL.createObjectURL(rawAfter); setT();
      $("sc").oninput = function () { sc = this.value / 100; setT() };
      var stage = $("stage"), drag = null;
      stage.onpointerdown = function (e) { drag = { x: e.clientX - tx, y: e.clientY - ty }; stage.setPointerCapture(e.pointerId) };
      stage.onpointermove = function (e) { if (!drag) return; tx = e.clientX - drag.x; ty = e.clientY - drag.y; setT() };
      stage.onpointerup = function () { drag = null };
      $("redo").onclick = function () { shootUI("start") };
      $("done").onclick = finish;
    }
  }
  function setT() { var s = $("shot"); if (s) s.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + sc + ")"; var v = $("scv"); if (v) v.textContent = Math.round(sc * 100) + "%" }
  function startCam() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { R.toast("Камера здесь недоступна. Сделайте фото камерой телефона"); $("fileAfter").click(); return }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
      .then(function (s) { stream = s; shootUI("live") })
      .catch(function () { R.toast("Камеру не включить в этом окне. Сделайте фото камерой телефона"); $("fileAfter").click() });
  }
  function stopCam() { if (stream) stream.getTracks().forEach(function (t) { t.stop() }); stream = null }
  function snap() {
    var v = $("video"), c = document.createElement("canvas"), W = 800, H = 1000; c.width = W; c.height = H;
    var x = c.getContext("2d"), k = Math.max(W / v.videoWidth, H / v.videoHeight); x.drawImage(v, (W - v.videoWidth * k) / 2, (H - v.videoHeight * k) / 2, v.videoWidth * k, v.videoHeight * k);
    c.toBlob(function (b) { stopCam(); useAfter(b) }, "image/jpeg", .9);
  }
  function useAfter(blob) { rawAfter = blob; tx = ty = 0; sc = 1; shootUI("align") }
  function finish() {
    var img = $("shot"), r = $("stage").getBoundingClientRect(), W = 800, H = 1000, k = W / r.width, c = document.createElement("canvas"); c.width = W; c.height = H;
    var x = c.getContext("2d"); x.fillStyle = "#1f1a14"; x.fillRect(0, 0, W, H); x.translate(W / 2 + tx * k, H / 2 + ty * k); x.scale(sc, sc);
    var s0 = Math.max(W / img.naturalWidth, H / img.naturalHeight); x.drawImage(img, -img.naturalWidth * s0 / 2, -img.naturalHeight * s0 / 2, img.naturalWidth * s0, img.naturalHeight * s0);
    c.toBlob(function (b) { st.after = b; st.afterDate = R.ymd(R.today()); st.sent = false; save().then(function () { render(); window.scrollTo(0, $("cmp").getBoundingClientRect().top + window.scrollY - 80) }) }, "image/jpeg", .9);
  }

  // ---------- коллаж и отправка Марине ----------
  function imgFrom(blob) { return new Promise(function (res) { var i = new Image(); i.onload = function () { res(i) }; i.src = URL.createObjectURL(blob) }) }
  function collage() {
    return Promise.all([imgFrom(st.before), imgFrom(st.after), document.fonts.load('60px "AngelicaC"'), document.fonts.load('800 30px "Mulish"')]).then(function (r) {
      var W = 1200, H = 860, c = document.createElement("canvas"); c.width = W; c.height = H; var x = c.getContext("2d");
      x.fillStyle = "#f4eee4"; x.fillRect(0, 0, W, H);
      [r[0], r[1]].forEach(function (im, k) {
        var w = 580, h = 725, ox = 13 + k * 594, oy = 13, s = Math.max(w / im.naturalWidth, h / im.naturalHeight);
        x.save(); x.beginPath(); x.rect(ox, oy, w, h); x.clip();
        x.drawImage(im, ox + (w - im.naturalWidth * s) / 2, oy + (h - im.naturalHeight * s) / 2, im.naturalWidth * s, im.naturalHeight * s); x.restore();
        x.fillStyle = "rgba(31,26,20,.8)"; x.beginPath(); x.roundRect ? x.roundRect(ox + 16, oy + 16, 120, 48, 14) : x.rect(ox + 16, oy + 16, 120, 48); x.fill();
        x.fillStyle = "#fff"; x.font = '800 26px "Mulish", sans-serif'; x.textAlign = "center"; x.fillText(k ? "ПОСЛЕ" : "ДО", ox + 76, oy + 49);
      });
      var g = x.createLinearGradient(0, 760, 0, 830); g.addColorStop(0, "#4a3810"); g.addColorStop(.5, "#8f6c22"); g.addColorStop(1, "#c8962c");
      x.fillStyle = g; x.font = '56px "AngelicaC", Georgia, serif'; x.textAlign = "left"; x.fillText("Razden’sya", 24, 818);
      x.fillStyle = "#6e5520"; x.font = '700 22px "Mulish", sans-serif'; x.textAlign = "right"; x.fillText(R.zone(st.zone).name.toLowerCase() + " · " + days() + " " + R.plural(days(), "день", "дня", "дней") + " после процедуры", W - 24, 812);
      return new Promise(function (res) { c.toBlob(res, "image/jpeg", .9) });
    });
  }
  function caption() { return "Марина, фото «после» для сравнения.\nЗона: " + R.zone(st.zone).name.toLowerCase() + ", процедура " + R.date(R.parse(st.proc)) + ", прошло " + days() + " " + R.plural(days(), "день", "дня", "дней") + ".\n✅ Разрешаю использовать фото «до» и «после» в постах без лица и имени." }
  function markSent() { st.sent = true; save().then(render); R.toast("Отправлено Марине") }
  function send() {
    R.toast("Готовлю фото для Марины…");
    collage().then(function (col) {
      var files = [new File([st.after], "posle.jpg", { type: "image/jpeg" }), new File([col], "do-posle.jpg", { type: "image/jpeg" })], text = caption();
      try { if (navigator.canShare && navigator.canShare({ files: files })) { navigator.share({ files: files, text: text }).then(markSent, function () {}); return } } catch (e) {}
      // запасной путь: сохранить картинку долгим нажатием, подпись скопировать, открыть чат
      R.closeSheet();
      var u = URL.createObjectURL(col), back = document.createElement("div"); back.className = "sheet-back";
      back.innerHTML = '<div class="sheet"><h3>Отправка Марине</h3><img src="' + u + '" alt="До и после" style="width:100%;border-radius:12px"><p class="hint">1. Нажмите на картинку и удерживайте → «Сохранить».<br>2. Нажмите кнопку ниже: подпись скопируется, откроется чат с Мариной.<br>3. Прикрепите картинку и вставьте подпись.</p><a class="btn btn-gold" id="go" target="_blank" rel="noopener" href="' + R.contacts.tg + '">' + R.icon("tg") + 'Скопировать подпись и открыть Telegram</a><button type="button" class="btn btn-soft" data-close>Закрыть</button></div>';
      document.body.appendChild(back);
      back.addEventListener("click", function (e) { if (e.target === back || e.target.closest("[data-close]")) R.closeSheet(); if (e.target.closest("#go")) { R.copy(text); R.closeSheet(); markSent() } });
    });
  }

  $("fileBefore").addEventListener("change", function () { var f = this.files[0]; this.value = ""; if (!f) return; st.before = f; st.after = null; st.afterDate = null; st.sent = false; save().then(render); R.toast("Фото «до» загружено") });
  ["fileAfter", "fileAfterGallery"].forEach(function (id) { $(id).addEventListener("change", function () { var f = this.files[0]; this.value = ""; if (f) useAfter(f) }) });
  load().then(render);
})();
</script>
</body>
